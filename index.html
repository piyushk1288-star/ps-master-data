<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLS E Services Ltd – Login</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.login-box{
  background:#fff;
  padding:25px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  width:300px;
  text-align:center;
}
.login-box h2{margin-bottom:15px}
.login-box input{
  width:90%;
  padding:10px;
  margin:8px 0;
}
.login-box button{
  width:95%;
  padding:10px;
  background:#007bff;
  color:#fff;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.login-box button:hover{background:#0056b3}
</style>
</head>

<body>

<div class="login-box">
  <h2>Login</h2>

  <input type="text" id="username" placeholder="User ID">
  <input type="password" id="password" placeholder="Password">

  <!-- IMPORTANT: type="button" -->
  <button type="button" onclick="login()">Login</button>
</div>

<script>
function login(){
  var u = document.getElementById("username").value.trim();
  var p = document.getElementById("password").value.trim();

  // 👇 SAME ID / PASSWORD
  if(u === "admin" && p === "12345"){
    sessionStorage.setItem("login","yes");
    window.location.href = "dashboard.html";
  } else {
    alert("Invalid ID or Password");
  }
}
</script>

</body>
</html>
