function downloadExcel(){
  if(typeof XLSX === 'undefined'){ 
    alert('XLSX library not loaded'); 
    return; 
  }
  let out = rawData.map((row, i) => {
    let r = {};
    r['SN'] = i + 1;
    for (let k in row) {
      if(k !== 'SN') r[k] = row[k];
    }
    return r;
  });
  let ws = XLSX.utils.json_to_sheet(out);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "PS Master");
  XLSX.writeFile(wb, "PS_Master_Data.xlsx");
}
